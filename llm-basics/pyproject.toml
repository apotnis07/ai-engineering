[project]
name = "llm-basics"
version = "0.1.0"
description = "Week 1: Claude API fundamentals"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["common"]
